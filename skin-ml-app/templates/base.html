<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Skin Type Machine Learning Benchmark - Classification, Clustering, Regression &amp; Recommendation">
    <title>{% block title %}Skin ML Benchmark{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
    <div class="bg-orbs">
        <div class="orb"></div>
        <div class="orb"></div>
        <div class="orb"></div>
    </div>

    <div class="app-container">
        <!-- Sidebar -->
        <nav class="sidebar">
            <a href="/" class="logo">
                <div class="logo-icon">S</div>
                <div>
                    <div class="logo-text">SkinML</div>
                    <div class="logo-sub">Benchmark Suite</div>
                </div>
            </a>

            <div class="nav-section">
                <div class="nav-label">Overview</div>
                <a href="/" class="nav-link {% if request.path == '/' %}active{% endif %}">
                    <span class="nav-icon">📊</span> Dashboard
                </a>
            </div>

            <div class="nav-section">
                <div class="nav-label">ML Modules</div>
                <a href="/classification" class="nav-link {% if request.path == '/classification' %}active{% endif %}">
                    <span class="nav-icon">🎯</span> Classification
                </a>
                <a href="/clustering" class="nav-link {% if request.path == '/clustering' %}active{% endif %}">
                    <span class="nav-icon">🔵</span> Clustering
                </a>
                <a href="/regression" class="nav-link {% if request.path == '/regression' %}active{% endif %}">
                    <span class="nav-icon">📈</span> Regression
                </a>
                <a href="/ann" class="nav-link {% if request.path == '/ann' %}active{% endif %}">
                    <span class="nav-icon">🧠</span> Neural Network
                </a>
                <a href="/cnn" class="nav-link {% if request.path == '/cnn' %}active{% endif %}">
                    <span class="nav-icon">📸</span> CNN Vision
                </a>
                <a href="/recommendation" class="nav-link {% if request.path == '/recommendation' %}active{% endif %}">
                    <span class="nav-icon">💡</span> Recommendation
                </a>
            </div>

            <div style="flex: 1;"></div>
            <div style="padding: 12px; font-size: 11px; color: var(--text-muted); border-top: 1px solid var(--border-glass);">
                Skin Type Dataset<br>10,000 samples &bull; 10 features
            </div>
        </nav>

        <!-- Main Content -->
        <main class="main-content">
            {% block content %}{% endblock %}
        </main>
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
